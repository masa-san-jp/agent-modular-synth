<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="synth-tab-token" content="">
<title>agent-modular-synth(開発中)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  button { font-size: 1rem; padding: .6rem 1rem; margin: .2rem .3rem .2rem 0; }
  #panic { background: #b00020; color: #fff; border: 0; }
  #keys button { min-width: 2.6rem; padding: 1.4rem .4rem .5rem; }
  .row { margin: .8rem 0; }
  .note { background: #fff7e0; border: 1px solid #e0c060; padding: .6rem .8rem; }
  #error { color: #b00020; }
  #meter, #patch, #modules { font-family: ui-monospace, monospace; font-size: .85rem; }
  label { display: inline-block; min-width: 7rem; }
</style>
</head>
<body>
<h1>agent-modular-synth(開発中)</h1>
<p>動作確認用の最小画面です。画面の操作も、ローカルサーバー経由のエージェントの操作も、同じコマンドでこのタブのパッチを編集します。パッチを組み替える編集画面と MIDI 機器の接続は未実装です。</p>
<p class="note"><strong>注意:</strong> ヘッドホンを使うときは、先に機器側の音量を下げてください。このアプリは低い音量から始まり、出力にはリミッターが入っていますが、機器側の音量は調整できません。</p>
<div class="row">
  <button id="start">音声開始</button>
  <span id="state"></span>
</div>
<div class="row">
  <button id="demo">デモ用パッチを組む</button>
  <button id="undo">取り消し</button>
  <button id="redo">やり直し</button>
  <button id="panic">緊急停止</button>
  <button id="release">緊急停止を解除</button>
</div>
<div class="row" id="keys"></div>
<div class="row"><label for="level">マスター音量</label><input id="level" type="range" min="-60" max="0" step="1" value="-20"> <span id="levelLabel"></span></div>
<div class="row" id="patch"></div>
<div class="row" id="modules"></div>
<div class="row" id="meter"></div>
<div class="row" id="error"></div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
