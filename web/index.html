<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="synth-tab-token" content="">
<title>agent-modular-synth(開発中)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="blocked" role="alert" hidden></div>
<h1>agent-modular-synth</h1>
<div id="messages" aria-live="polite">
  <div id="error" role="alert"></div>
  <div id="notice"></div>
  <div id="confirm" class="row" hidden>
    <span id="confirm-text"></span>
    <button id="confirm-ok" type="button"></button>
    <button id="confirm-cancel" type="button">やめる</button>
  </div>
</div>

<section aria-labelledby="h-main" id="main-controls">
  <h2 id="h-main">音量と演奏</h2>
  <div class="row">
    <label for="level">マスター音量</label>
    <input id="level" type="range" min="-60" max="0" step="1" value="-20">
    <span id="levelLabel" class="mono"></span>
    <button id="start" type="button">音声開始</button>
    <span id="state" class="mono"></span>
    <span id="clip" hidden>クリップ</span>
  </div>
  <form id="prompt-form" class="row">
    <label for="prompt-text">prompt</label>
    <input id="prompt-text" type="text" maxlength="500" autocomplete="off">
    <button id="prompt-send" type="submit">送る</button>
  </form>
  <ul id="prompt-list" aria-label="送った指示"></ul>
  <div class="row">
    <span id="perf-state" class="mono"></span>
    <button id="score-stop" type="button">停止</button>
  </div>
</section>

<section aria-labelledby="h-rack" id="rack-section">
  <h2 id="h-rack">ラック</h2>
  <canvas id="rack" role="img" aria-label="ラックの表示"></canvas>
  <div id="rack-hud" class="hud" aria-hidden="true"></div>
</section>

<section aria-labelledby="h-perf">
  <h2 id="h-perf">演奏の記録</h2>
  <form id="plan-form" class="row">
    <label for="plan-minutes">演奏の長さ(分)</label>
    <input id="plan-minutes" type="number" min="1" max="1440" step="1" size="5">
    <button id="plan-set" type="submit">決める</button>
  </form>
  <div class="row mono" id="perf-saved"></div>
  <div class="row">
    <span>保存された演奏</span>
    <button id="performance-refresh" type="button">更新</button>
  </div>
  <ul id="performance-list" aria-label="保存された演奏"></ul>
</section>

<section aria-labelledby="h-patch">
  <h2 id="h-patch">パッチ</h2>
  <div class="row mono" id="patch"></div>
  <div class="row">
    <button id="undo" type="button">取り消し</button>
    <button id="redo" type="button">やり直し</button>
    <button id="new" type="button">新規作成</button>
    <button id="demo" type="button">デモ用パッチ</button>
  </div>
  <div class="row">
    <label for="save-name">名前</label>
    <input id="save-name" type="text" maxlength="64" autocomplete="off" spellcheck="false">
    <button id="save" type="button">保存</button>
  </div>
  <div class="row">
    <span id="library-state" class="muted"></span>
    <button id="library-refresh" type="button" class="small">更新</button>
  </div>
  <ul id="library" class="list"></ul>
</section>

<section aria-labelledby="h-modules">
  <h2 id="h-modules">モジュール</h2>
  <div class="row">
    <label for="add-type">種別</label>
    <select id="add-type"></select>
    <label for="add-id">ID</label>
    <input id="add-id" type="text" maxlength="32" size="10" autocomplete="off" spellcheck="false">
    <button id="add-module" type="button">追加</button>
  </div>
  <div id="module-list"></div>
</section>

<section aria-labelledby="h-cables">
  <h2 id="h-cables">ケーブル</h2>
  <div class="row">
    <label for="cable-from">出力</label>
    <select id="cable-from"></select>
    <span aria-hidden="true">→</span>
    <label for="cable-to">入力</label>
    <select id="cable-to"></select>
    <button id="cable-connect" type="button">接続</button>
  </div>
  <ul id="cable-list" class="list"></ul>
</section>

<section aria-labelledby="h-history">
  <h2 id="h-history">変更の履歴</h2>
  <ol id="history" class="list"></ol>
</section>

<section aria-labelledby="h-util" id="utility">
  <h2 id="h-util">ユーティリティ</h2>
  <div class="row">
    <button id="panic" type="button" title="Esc">緊急停止</button>
    <button id="release" type="button">緊急停止を解除</button>
  </div>
  <div class="row mono" id="meter"></div>
  <div class="row">
    <button id="midi-connect" type="button">MIDI を接続</button>
    <span id="midi-state"></span>
  </div>
  <div class="row"><span class="muted">鍵盤</span><div class="row" id="keys" aria-label="画面鍵盤"></div></div>
  <div class="row">
    <label for="hue">画面の色</label>
    <select id="hue"></select>
    <label for="hue-period">自動の周期</label>
    <select id="hue-period"></select>
  </div>
  <p class="note">ヘッドホン: 先に機器の音量を下げる</p>
</section>

<script type="module" src="dist/main.js"></script>
</body>
</html>
